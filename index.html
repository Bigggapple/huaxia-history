home=function(){location.hash='';document.body.classList.add('gallery-home');main.innerHTML=`<section class="gallery-heading"><div><div class="eyebrow">FIGURES ACROSS THE AGES</div><h1>与千年人物，<em>照面。</em></h1></div><p>将光标停在时间线的图腾上<br>让一个时代，从人群中浮现。</p></section><div class="panorama-scroll"><section class="panorama" aria-label="中国历史人物群像"><div class="era-watermark">华夏</div>${people.map((p,j)=>({p,j})).sort((a,b)=>a.p[1]-b.p[1]).map(({p,j})=>`<button class="person" data-era="${p[1]}" aria-label="${p[0]}，${rows[p[1]][0]}，点击查看朝代" onmouseenter="activate(${p[1]})" onfocus="activate(${p[1]})" onclick="show(${p[1]},'people')"><span class="portrait" role="img" aria-label="${p[0]}历史艺术形象" style="background-image:url('assets/portraits-${Math.floor(j/4)}.png');background-size:${1536/portraitWindows[j][1]*100}% 100%;background-position:${portraitWindows[j][0]/(1536-portraitWindows[j][1])*100}% 50%"></span><span class="person-name">${p[0]}</span></button>`).join('')}</section></div><section class="era-insight" aria-live="polite"><div class="epoch"><span class="eyebrow">此刻 · 聚焦</span><h2 id="epochName"></h2><span id="epochDate"></span></div><div id="stories"></div><button id="explore" class="explore">进入这个时代 <span>↗</span></button></section><section class="timeline-section"><div class="timeline-caption"><span>一条长线，千年回响</span><span>悬停聚焦 · 点击图腾进入朝代 · 手机上轻触聚焦</span></div><div class="timeline-scroll"><div class="totem-line">${rows.map((r,i)=>`<button class="totem" data-era="${i}" aria-label="${r[0]} ${r[1]}" onmouseenter="activate(${i})" onfocus="activate(${i})" onclick="if(matchMedia('(hover: hover)').matches)show(${i});else activate(${i});">${icon(i)}<span class="era-label">${r[0]}</span><span class="line-dot"></span><time>${r[1].split('—')[0].replace('公元','')}<br><small>— ${r[1].split('—')[1]}</small></time></button>`).join('')}</div></div><p class="chronology-note">公元纪年 · 图腾为时代文化的视觉象征，非历史徽章。各时期等距呈现，并立政权与年代交叠沿用原分期。</p></section><details class="credits"><summary>画像来源与展示说明</summary><p>人物图
